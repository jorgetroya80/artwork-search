services:
  - type: web
    name: artwork-search
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    # Quoted: YAML 1.1 parsers read a bare off as false. Only release.yml deploys, through the hook
    autoDeployTrigger: 'off'
    envVars:
      # Render has no documented pnpm version selection, so the build command installs instead
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    # Same headers as nginx.conf
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Vite puts content-hashed files under /assets/, so they never change
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
