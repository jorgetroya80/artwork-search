services:
  - type: web
    name: artwork-search
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    # Deploy each push to main once its GitHub checks pass, and only if it changes a build input
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - src/**
        - config/**
        - public/**
        - index.html
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vite.config.ts
        - tsconfig*.json
        - .nvmrc
        - render.yaml
    envVars:
      # Render has no documented pnpm version selection, so the build command installs instead
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      # Theme name from src/themes. Changing it changes the live site's theme on the next deploy
      - key: VITE_THEME
        value: gallery
    # Same headers as nginx.conf
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Vite puts content-hashed files under /assets/, so they never change
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
