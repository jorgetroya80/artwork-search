<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>Page not found | Artwork search</title>
    <!-- Served for any unknown path, so every link and asset path is absolute and nothing loads
         from another origin -->
    <style>
      :root {
        --wall: #44505a;
        --wall-light: #56636e;
        --gilt-deep: #5e4214;
        --gilt-dark: #8a6420;
        --gilt: #c9a24b;
        --gilt-light: #eed89a;
        --paper: #f4f2ee;
        --ink: #1c1917;
        --ink-muted: #57534e;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 3rem 1rem;
        overflow-x: hidden;
        /* A gallery spotlight from above, falling on the frame */
        background:
          radial-gradient(
            ellipse 40rem 28rem at 50% 18%,
            rgb(255 240 210 / 0.16),
            transparent 70%
          ),
          linear-gradient(var(--wall-light), var(--wall) 60%);
        color: var(--ink);
        font-family:
          'Gill Sans', 'Gill Sans MT', Seravek, Calibri, 'Trebuchet MS',
          sans-serif;
        line-height: 1.45;
      }

      main {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: clamp(2rem, 6vw, 4.5rem);
      }

      /* The frame, wire and nail swing together around the nail */
      .hanging {
        position: relative;
        width: min(22rem, 70vw);
        padding-top: 3rem;
        transform: rotate(-2deg);
        transform-origin: 50% 0.4rem;
        animation: swing 2.8s cubic-bezier(0.3, 0.7, 0.4, 1) both;
      }

      .nail {
        position: absolute;
        top: 0;
        left: 50%;
        width: 0.8rem;
        height: 0.8rem;
        margin-left: -0.4rem;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #d6d3d1, #57534e);
        box-shadow: 0 2px 3px rgb(0 0 0 / 0.5);
      }

      .wire {
        position: absolute;
        top: 0.4rem;
        left: 18%;
        width: 64%;
        height: 2.7rem;
        overflow: visible;
      }

      .wire polyline {
        fill: none;
        stroke: #a8a29e;
        stroke-width: 1.5;
      }

      .frame {
        aspect-ratio: 4 / 5;
        padding: clamp(1.1rem, 4vw, 1.6rem);
        background: linear-gradient(
          135deg,
          var(--gilt-light),
          var(--gilt) 22%,
          var(--gilt-dark) 48%,
          var(--gilt) 70%,
          var(--gilt-light) 84%,
          var(--gilt-dark)
        );
        box-shadow:
          inset 0 0 0 2px var(--gilt-deep),
          inset 0 0 0 5px var(--gilt-light),
          inset 0 0 0 7px var(--gilt-dark),
          0 1.4rem 2.2rem rgb(0 0 0 / 0.45);
      }

      /* Where the painting should be: just the wall, shaded by the moulding */
      .empty {
        height: 100%;
        background: var(--wall);
        box-shadow:
          0 0 0 3px var(--gilt-light),
          0 0 0 5px var(--gilt-deep),
          inset 0 0.7rem 1.4rem rgb(0 0 0 / 0.55);
      }

      .label {
        width: 15rem;
        margin-bottom: 1rem;
        padding: 1.1rem 1.2rem 1.25rem;
        background: var(--paper);
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.35);
        font-size: 0.95rem;
      }

      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .maker {
        margin-top: 0.15rem;
        font-size: 1.05rem;
      }

      .details {
        margin-top: 0.6rem;
        color: var(--ink-muted);
      }

      .note {
        margin-top: 0.9rem;
        padding-top: 0.9rem;
        border-top: 1px solid #d6d3d1;
      }

      a {
        display: inline-block;
        margin-top: 0.75rem;
        color: var(--ink);
        font-weight: 600;
        text-underline-offset: 0.2em;
      }

      a:hover {
        text-decoration-thickness: 2px;
      }

      a:focus-visible {
        outline: 3px solid var(--gilt-dark);
        outline-offset: 3px;
      }

      @keyframes swing {
        0% {
          transform: rotate(9deg);
        }
        30% {
          transform: rotate(-6deg);
        }
        55% {
          transform: rotate(3deg);
        }
        78% {
          transform: rotate(-3.5deg);
        }
        100% {
          transform: rotate(-2deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hanging {
          animation: none;
        }
      }

      @media (max-width: 40rem) {
        main {
          flex-direction: column;
          align-items: center;
        }

        .label {
          width: min(22rem, 100%);
          margin-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hanging" aria-hidden="true">
        <span class="nail"></span>
        <svg class="wire" viewBox="0 0 100 40" preserveAspectRatio="none">
          <polyline
            points="0,40 50,0 100,40"
            vector-effect="non-scaling-stroke"
          />
        </svg>
        <div class="frame"><div class="empty"></div></div>
      </div>

      <section class="label">
        <h1>Untitled (404)</h1>
        <p class="maker">Artist unknown</p>
        <p class="details">
          Date unknown<br />
          Empty frame, 0 × 0 cm<br />
          SK-A-404
        </p>
        <p class="note">
          There is no page at this address. The link may be wrong, or the page
          may have moved.
        </p>
        <a href="/">Search the collection</a>
      </section>
    </main>
  </body>
</html>
