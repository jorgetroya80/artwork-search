<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A gilded frame under a magnifying glass: searching the collection. The glass has a light
       outline under its dark stroke, so it reads on light and dark tab bars -->
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed89a" />
      <stop offset="0.45" stop-color="#c9a24b" />
      <stop offset="1" stop-color="#8a6420" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="22" height="27" rx="1" fill="url(#gilt)" />
  <rect x="4.5" y="4.5" width="15" height="20" fill="#44505a" />
  <g fill="none" stroke-linecap="round">
    <circle cx="21" cy="20" r="5.5" stroke="#f4f2ee" stroke-width="5" />
    <path d="M25 24 29.5 28.5" stroke="#f4f2ee" stroke-width="6" />
    <circle cx="21" cy="20" r="5.5" fill="#f4f2ee" fill-opacity="0.35" stroke="#1c1917" stroke-width="2.5" />
    <path d="M25 24 29.5 28.5" stroke="#1c1917" stroke-width="3.5" />
  </g>
</svg>
